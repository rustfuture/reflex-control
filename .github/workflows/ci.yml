name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.88.0", stable]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Test Suite
        run: cargo test --workspace --all-targets

      - name: Build Examples
        run: |
          cargo build --bin example-verifier-gate
          cargo build --bin example-shadow-mode

      - name: Test Verifier Gate Demo
        run: cargo run --bin reflex -- demo verifier-gate

      - name: Test Shadow Mode on Verified Dataset
        run: cargo run --bin reflex -- shadow run

      - name: Test Cost vs Risk Pareto
        run: cargo run --bin reflex -- pareto

  fixtures:
    name: Fixtures match generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate v2 fixtures
        run: python3 docs/experiments/generate_v2_datasets.py

      - name: Fail if committed fixtures drifted from the generator
        run: git diff --exit-code -- fixtures/
