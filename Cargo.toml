[workspace]
resolver = "2"
members = [
    "crates/reflex-core",
    "crates/reflex-provider",
    "crates/reflex-jev",
    "crates/reflex-policy",
    "crates/reflex-telemetry",
    "crates/reflex-calibration",
    "crates/reflex-cli",
    "examples/verifier-gate",
    "examples/shadow-mode",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
authors = ["Reflex Control Authors"]
license = "MIT"
description = "A calibrated System-1 control plane for AI agents and swarms"
publish = false

[workspace.dependencies]
reflex-core = { path = "crates/reflex-core" }
reflex-provider = { path = "crates/reflex-provider" }
reflex-jev = { path = "crates/reflex-jev" }
reflex-policy = { path = "crates/reflex-policy" }
reflex-telemetry = { path = "crates/reflex-telemetry" }
reflex-calibration = { path = "crates/reflex-calibration" }
reflex-cli = { path = "crates/reflex-cli" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1.43", features = ["full"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.33", features = ["bundled", "chrono", "serde_json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.8"
